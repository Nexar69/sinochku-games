services:
  social:
    build:
      context: ..
      dockerfile: server/SinochkuGames.Server/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      SINOCHKU_JWT_KEY: ${SINOCHKU_JWT_KEY}
      SINOCHKU_BOOTSTRAP_INVITE: ${SINOCHKU_BOOTSTRAP_INVITE}
      SINOCHKU_DATA_DIR: /data
    volumes:
      - sinochku-data:/data
      - sinochku-uploads:/app/wwwroot/uploads
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - social
    networks:
      - web

volumes:
  sinochku-data:
  sinochku-uploads:
  caddy-data:
  caddy-config:

networks:
  web:
