name: V2 Build

on:
  push:
    branches:
      - v2-platform
    paths:
      - "v2/**"
      - "assets/**"
      - ".github/workflows/v2-build.yml"
  pull_request:
    paths:
      - "v2/**"
      - "assets/**"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore v2/SinochkuGames.csproj

      - name: Build
        run: dotnet build v2/SinochkuGames.csproj -c Release --no-restore

      - name: Publish single-file launcher
        run: dotnet publish v2/SinochkuGames.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/v2

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SinochkuGames-v2
          path: artifacts/v2/
