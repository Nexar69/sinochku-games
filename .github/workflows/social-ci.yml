name: Social platform CI

on:
  push:
    branches:
      - v3-social-platform
      - main
    paths:
      - "server/**"
      - "deploy/**"
      - "src/SinochkuGames/**"
      - ".github/workflows/social-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "deploy/**"
      - "src/SinochkuGames/**"
      - ".github/workflows/social-ci.yml"

permissions:
  contents: write
  packages: write

concurrency:
  group: social-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test social server
        run: dotnet test server/SinochkuGames.Server.Tests/SinochkuGames.Server.Tests.csproj -c Release

      - name: Build server container
        run: docker build -f server/SinochkuGames.Server/Dockerfile .

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test launcher
        run: dotnet test tests/SinochkuGames.Tests/SinochkuGames.Tests.csproj -c Release

      - name: Publish launcher
        run: >
          dotnet publish src/SinochkuGames/SinochkuGames.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o dist/v3

      - uses: actions/upload-artifact@v4
        with:
          name: SinochkuGames-v3-social
          path: dist/v3/SinochkuGames.exe


  alpha-release:
    if: github.event_name == 'pull_request' && github.head_ref == 'v3-release-bootstrap-pr'
    needs:
      - windows-launcher
      - server
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SinochkuGames-v3-social
          path: dist/v3

      - name: Generate SHA-256
        shell: powershell
        run: |
          $hash = (Get-FileHash dist/v3/SinochkuGames.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path dist/v3/SinochkuGames.exe.sha256 -Value $hash -Encoding ascii

      - name: Publish v3 alpha
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-alpha.1
          target_commitish: main
          name: СИНОЧКУ GAMES™ v3.0.0-alpha.1
          prerelease: true
          generate_release_notes: true
          files: |
            dist/v3/SinochkuGames.exe
            dist/v3/SinochkuGames.exe.sha256

  alpha-server-image:
    if: github.event_name == 'pull_request' && github.head_ref == 'v3-release-bootstrap-pr'
    needs:
      - server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push social server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/SinochkuGames.Server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sinochku-social:v3.0.0-alpha.1
            ghcr.io/${{ github.repository_owner }}/sinochku-social:latest
