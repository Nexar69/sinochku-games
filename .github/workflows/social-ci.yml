name: Social platform CI

on:
  push:
    branches:
      - v3-social-platform
      - main
    paths:
      - "server/**"
      - "deploy/**"
      - "src/SinochkuGames/**"
      - ".github/workflows/social-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "deploy/**"
      - "src/SinochkuGames/**"
      - ".github/workflows/social-ci.yml"

concurrency:
  group: social-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test social server
        run: dotnet test server/SinochkuGames.Server.Tests/SinochkuGames.Server.Tests.csproj -c Release

      - name: Build server container
        run: docker build -f server/SinochkuGames.Server/Dockerfile .

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test launcher
        run: dotnet test tests/SinochkuGames.Tests/SinochkuGames.Tests.csproj -c Release

      - name: Publish launcher
        run: >
          dotnet publish src/SinochkuGames/SinochkuGames.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o dist/v3

      - uses: actions/upload-artifact@v4
        with:
          name: SinochkuGames-v3-social
          path: dist/v3/SinochkuGames.exe
