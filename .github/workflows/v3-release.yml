name: v3 Release

on:
  push:
    tags:
      - "v3.*"

permissions:
  contents: write
  packages: write

jobs:
  launcher-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test launcher
        run: dotnet test tests/SinochkuGames.Tests/SinochkuGames.Tests.csproj -c Release

      - name: Publish launcher
        run: >
          dotnet publish src/SinochkuGames/SinochkuGames.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o dist/v3

      - name: Generate SHA-256
        shell: powershell
        run: |
          $hash = (Get-FileHash dist/v3/SinochkuGames.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path dist/v3/SinochkuGames.exe.sha256 -Value $hash -Encoding ascii

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/v3/SinochkuGames.exe
            dist/v3/SinochkuGames.exe.sha256

  social-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test server
        run: dotnet test server/SinochkuGames.Server.Tests/SinochkuGames.Server.Tests.csproj -c Release

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push social server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/SinochkuGames.Server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sinochku-social:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/sinochku-social:latest
