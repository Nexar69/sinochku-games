name: v2 CI

on:
  push:
    branches:
      - v2-platform
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "assets/**"
      - ".github/workflows/v2-*.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "assets/**"
      - ".github/workflows/v2-*.yml"

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore tests/SinochkuGames.Tests/SinochkuGames.Tests.csproj

      - name: Test
        run: dotnet test tests/SinochkuGames.Tests/SinochkuGames.Tests.csproj -c Release --no-restore

      - name: Publish portable release
        run: >
          dotnet publish src/SinochkuGames/SinochkuGames.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o dist/v2

      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: SinochkuGames-v2
          path: dist/v2/SinochkuGames.exe
